<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Diabetes Risk Screening{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">
      <span class="brand-mark">DX</span>
      <span class="brand-text">Diabetes Risk Panel</span>
    </a>
    <nav class="nav">
      <a href="{{ url_for('home') }}">Home</a>
      <a href="{{ url_for('predict_page') }}">Screen a patient</a>
      <a href="{{ url_for('dashboard') }}">Model dashboard</a>
      <a href="{{ url_for('about') }}">About</a>

    </nav>
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <p><strong>Screening only — not a medical diagnosis.</strong> This tool estimates statistical risk from a research dataset (Pima Indians Diabetes Database) and is not validated for clinical use.</p>
  </footer>
</body>
</html>
